<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebChat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="screen-login" class="screen active">
    <div class="login-container">
      <h1>WebChat</h1>
      <div class="input-group">
        <label for="username-input">Имя пользователя</label>
        <input type="text" id="username-input" placeholder="Введите ваше имя" autofocus>
      </div>
      <button id="login-btn">Войти в чат</button>
      <p style="margin-top:20px;text-align:center;font-size:13px;color:#999">
        <a href="/install/" style="color:#667eea;text-decoration:none">Руководство</a>
        <span style="margin:0 8px">·</span>
        <a href="/admin/" style="color:#667eea;text-decoration:none">Админка</a>
      </p>
    </div>
  </div>

  <div id="screen-agents" class="screen">
    <div class="sidebar-header">
      <span class="user-badge" id="current-user"></span>
      <button id="logout-btn">Выйти</button>
    </div>
    <div id="agent-list" class="agent-list">
      <!-- Agent cards rendered by JS -->
    </div>
  </div>

  <div id="screen-chat" class="screen">
    <div class="chat-header">
      <button id="back-btn" aria-label="Вернуться к списку агентов">&#10094;</button>
      <div class="chat-agent-info">
        <span class="agent-avatar" id="chat-agent-avatar"></span>
        <span id="chat-agent-name"></span>
      </div>
    </div>
    <div id="message-list" class="message-list">
      <!-- Messages rendered by JS -->
    </div>
    <div class="chat-input-area">
      <button id="file-btn" type="button" aria-label="Прикрепить файл">&#128206;</button>
      <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.gif,.xlsx,.docx,.pdf" hidden>
      <input type="text" id="message-input" placeholder="Введите сообщение…" autofocus>
      <button id="send-btn">Отправить</button>
    </div>
    <div id="attachment-preview" class="attachment-preview"></div>
  </div>

  <script src="vendor/markdown-it.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
